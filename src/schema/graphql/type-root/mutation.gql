type Mutation {

    register(user: UserInput!): ResultUser!
    updateUser(user: UserInput!): ResultUser!
    deleteUser(id: ID!): ResultUser!
    blockUser(id: ID!, active:Boolean!): ResultUser!
    # añadir los generos de los juegos

    addGenre(genre: String!): ResultGenre!
    updateGenre(genre: GenreInput!): ResultGenre!
    deleteGenre(id: ID!): ResultGenre!
    blockGenre(id: ID!,active: Boolean!): ResultGenre!

    #Envio de emails automaticos

    sendEmail(mail: MailInput!): ResultMail!
    activeUserEmail(id: ID!,email: String!): ResultMail!
    activeUser(id: ID!,birthDate: String!,password: String!): ResultMail!
    resetPasswordEmail(email: String!): ResultMail!
    resetPassword(id: ID!,password: String!): ResultUser!

}